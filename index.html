<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>QR Code Scanner • Dark Luxury</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        luxury: {
                            950: '#05050c',
                            900: '#0a0a14',
                            800: '#111122',
                            700: '#1a1a2e',
                            600: '#252540',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Html5-QRCode Library -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="font-sans antialiased min-h-screen flex items-center justify-center p-4 relative z-10">
    <main class="w-full max-w-md mx-auto relative">
        <!-- Glass card -->
        <div class="bg-luxury-800/70 backdrop-blur-sm rounded-3xl shadow-[0_25px_50px_-12px_rgba(0,0,0,0.8)] border border-white/5 p-6 md:p-8 transition-all">

            <!-- Header dengan ikon premium -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500/20 to-purple-500/20 mb-5 shadow-lg shadow-indigo-500/10">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="url(#iconGradient)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <defs>
                            <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#a78bfa" />
                                <stop offset="100%" stop-color="#60a5fa" />
                            </linearGradient>
                        </defs>
                        <rect x="3" y="3" width="7" height="7" rx="1" />
                        <rect x="14" y="3" width="7" height="7" rx="1" />
                        <rect x="3" y="14" width="7" height="7" rx="1" />
                        <rect x="14" y="14" width="7" height="7" rx="1" />
                    </svg>
                </div>
                <h1 class="text-2xl font-bold text-white tracking-tight">QR Vision</h1>
                <p class="text-gray-400 text-sm mt-1">Pindai & Analisis Aman</p>
            </div>

            <!-- Kamera -->
            <div id="reader" class="mx-auto mb-6"></div>

            <!-- Kontrol -->
            <div class="flex gap-3 justify-center mb-6">
                <button id="startBtn" class="group flex-1 bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 active:scale-95 text-white font-medium py-3.5 px-5 rounded-2xl transition-all flex items-center justify-center gap-2.5 shadow-xl shadow-indigo-600/20">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z" />
                    </svg>
                    <span>Pindai</span>
                </button>
                <button id="stopBtn" class="flex-1 bg-white/5 hover:bg-white/10 active:scale-95 text-gray-200 font-medium py-3.5 px-5 rounded-2xl transition-all flex items-center justify-center gap-2.5 border border-white/10 disabled:opacity-30 disabled:cursor-not-allowed" disabled>
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                    <span>Stop</span>
                </button>
            </div>

            <!-- Status -->
            <div id="statusMessage" class="text-sm text-center text-gray-400 mb-5 min-h-[24px] flex items-center justify-center gap-2"></div>

            <!-- Hasil Scan -->
            <div id="resultContainer" class="hidden bg-luxury-900/60 border border-white/5 rounded-2xl p-4 mt-2 backdrop-blur-sm">
                <div class="flex items-center gap-2 text-xs uppercase tracking-widest text-gray-500 mb-3">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m13.35-.622l1.757-1.757a4.5 4.5 0 00-6.364-6.364l-4.5 4.5a4.5 4.5 0 001.242 7.244" /></svg>
                    <span>Link Terdeteksi</span>
                </div>
                <div class="flex items-start gap-3">
                    <div class="flex-1 bg-luxury-800 rounded-xl p-3 border border-white/5">
                        <p id="resultText" class="text-indigo-200 font-mono text-sm break-all select-all"></p>
                    </div>
                    <button id="copyBtn" class="shrink-0 bg-white/5 hover:bg-white/10 p-2.5 rounded-xl border border-white/5 transition-colors" title="Salin URL">
                        <svg class="w-4 h-4 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>
                    </button>
                </div>
            </div>

            <!-- Peringatan File Berbahaya -->
            <div id="dangerFileAlert" class="hidden mt-4 bg-red-950/70 border border-red-800 rounded-2xl p-4 text-center blink-warning backdrop-blur-sm">
                <div class="flex items-center justify-center gap-2 text-red-300 font-semibold text-sm md:text-base">
                    <svg class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4.5c-.77-.833-2.694-.833-3.464 0L3.34 16.5c-.77.833.192 2.5 1.732 2.5z" /></svg>
                    <span>PERINGATAN: File berbahaya (.exe/.apk/.bat/...)</span>
                </div>
            </div>

            <!-- Detail Analisis -->
            <div id="urlDetailContainer" class="hidden mt-4 bg-luxury-900/60 border border-white/5 rounded-2xl p-4 backdrop-blur-sm">
                <div class="flex items-center gap-2 text-xs uppercase tracking-widest text-gray-500 mb-3">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                    <span>Analisis URL</span>
                    <span id="securityBadge" class="ml-auto px-2.5 py-0.5 rounded-full text-xs font-bold"></span>
                </div>
                <div class="space-y-1.5 text-sm">
                    <div class="flex justify-between py-1.5 px-2 rounded-lg bg-white/[0.02]"><span class="text-gray-400">Protokol</span><span id="detailProtocol" class="text-white font-mono">-</span></div>
                    <div class="flex justify-between py-1.5 px-2 rounded-lg bg-white/[0.02]"><span class="text-gray-400">Domain</span><span id="detailHost" class="text-white font-mono">-</span></div>
                    <div class="flex justify-between py-1.5 px-2 rounded-lg bg-white/[0.02]"><span class="text-gray-400">Port</span><span id="detailPort" class="text-white font-mono">-</span></div>
                    <div class="flex justify-between py-1.5 px-2 rounded-lg bg-white/[0.02]"><span class="text-gray-400">Path</span><span id="detailPath" class="text-white font-mono text-right max-w-[160px] truncate">-</span></div>
                    <div class="flex justify-between py-1.5 px-2 rounded-lg bg-white/[0.02]"><span class="text-gray-400">Query</span><span id="detailQuery" class="text-white font-mono text-right max-w-[160px] truncate">-</span></div>
                    <div class="flex justify-between py-1.5 px-2 rounded-lg bg-white/[0.02]"><span class="text-gray-400">Fragment</span><span id="detailHash" class="text-white font-mono">-</span></div>
                </div>
                <div id="securityNote" class="mt-3 text-xs text-yellow-300 hidden"></div>
            </div>

            <!-- Preview -->
            <div id="previewContainer" class="hidden mt-4 bg-luxury-900/60 border border-white/5 rounded-2xl p-4 backdrop-blur-sm">
                <div class="flex items-center gap-2 text-xs uppercase tracking-widest text-gray-500 mb-3">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                    <span>Live Preview</span>
                </div>
                <iframe id="previewFrame" class="preview-iframe" sandbox="allow-scripts allow-same-origin" loading="lazy"></iframe>
                <div id="previewError" class="hidden text-center py-10 text-gray-400">
                    <svg class="w-10 h-10 mx-auto mb-3 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M18.364 5.636l-12.728 12.728M5.636 5.636l12.728 12.728" /></svg>
                    <p class="text-sm font-medium">Tidak dapat ditampilkan</p>
                    <p class="text-xs mt-1 opacity-70">Situs memblokir pratinjau.</p>
                    <button id="openNewTabBtn" class="mt-3 inline-flex items-center gap-2 bg-white/5 hover:bg-white/10 border border-white/10 px-4 py-2 rounded-xl text-sm transition-colors">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>
                        Buka di Tab Baru
                    </button>
                </div>
                <p class="text-xs text-gray-500 mt-2 text-center">Isolasi penuh • Tidak bisa unduh atau akses data</p>
            </div>
        </div>
    </main>

    <script>
        (function() {
            if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                document.getElementById('statusMessage').innerHTML = '❌ Kamera perlu <b>HTTPS</b> atau localhost.';
                document.getElementById('startBtn').disabled = true;
                return;
            }
            if (typeof Html5Qrcode === 'undefined') {
                document.getElementById('statusMessage').textContent = '❌ Gagal memuat library.';
                document.getElementById('startBtn').disabled = true;
                return;
            }

            const $ = (id) => document.getElementById(id);
            const startBtn = $('startBtn');
            const stopBtn = $('stopBtn');
            const statusMsg = $('statusMessage');
            const resultContainer = $('resultContainer');
            const resultText = $('resultText');
            const copyBtn = $('copyBtn');
            const urlDetailContainer = $('urlDetailContainer');
            const securityBadge = $('securityBadge');
            const detailProtocol = $('detailProtocol');
            const detailHost = $('detailHost');
            const detailPort = $('detailPort');
            const detailPath = $('detailPath');
            const detailQuery = $('detailQuery');
            const detailHash = $('detailHash');
            const securityNote = $('securityNote');
            const previewContainer = $('previewContainer');
            const previewFrame = $('previewFrame');
            const previewError = $('previewError');
            const openNewTabBtn = $('openNewTabBtn');
            const dangerFileAlert = $('dangerFileAlert');

            let html5QrCode = null;
            let isScanning = false;
            let currentUrl = '';

            function applyFadeIn(el) {
                el.classList.remove('fade-in-up');
                void el.offsetWidth; // reflow
                el.classList.add('fade-in-up');
            }

            function parseAndCheckURL(urlString) {
                urlDetailContainer.classList.add('hidden');
                securityNote.classList.add('hidden');
                previewContainer.classList.add('hidden');
                previewFrame.src = '';
                previewError.classList.add('hidden');
                dangerFileAlert.classList.add('hidden');
                currentUrl = urlString;

                if (!urlString?.trim()) return;

                let url;
                try { url = new URL(urlString); } catch {
                    urlDetailContainer.classList.remove('hidden');
                    applyFadeIn(urlDetailContainer);
                    detailProtocol.textContent = '❌ Tidak valid';
                    detailHost.textContent = detailPort.textContent = detailPath.textContent = detailQuery.textContent = detailHash.textContent = '-';
                    securityBadge.textContent = 'TIDAK VALID';
                    securityBadge.className = 'px-2.5 py-0.5 rounded-full text-xs font-bold bg-red-900/60 text-red-300 border border-red-800';
                    securityNote.textContent = '⚠️ String bukan URL standar.';
                    securityNote.classList.remove('hidden');
                    return;
                }

                urlDetailContainer.classList.remove('hidden');
                applyFadeIn(urlDetailContainer);
                detailProtocol.textContent = url.protocol.replace(':', '');
                detailHost.textContent = url.hostname || '(kosong)';
                detailPort.textContent = url.port || (url.protocol === 'https:' ? '443' : url.protocol === 'http:' ? '80' : '-');
                detailPath.textContent = url.pathname || '/';
                detailQuery.textContent = url.search || '-';
                detailHash.textContent = url.hash || '-';

                const protocol = url.protocol.replace(':', '').toLowerCase();
                const isDangerousFile = /\.(exe|apk|bat|scr|msi|vbs)([?#].*)?$/i.test(url.pathname);
                let level = 'AMAN', badgeClass = 'bg-green-900/60 text-green-300 border-green-800', note = '';

                if (isDangerousFile) {
                    level = 'BERBAHAYA'; badgeClass = 'bg-red-900/60 text-red-300 border-red-800';
                    note = '🚫 File mencurigakan! Jangan diunduh.';
                    dangerFileAlert.classList.remove('hidden');
                    applyFadeIn(dangerFileAlert);
                } else {
                    if (protocol === 'https') { level = 'AMAN (HTTPS)'; }
                    else if (protocol === 'http') { level = 'PERINGATAN'; badgeClass = 'bg-yellow-900/60 text-yellow-300 border-yellow-800'; note = '⚠️ HTTP tidak terenkripsi.'; }
                    else if (['javascript','data','vbscript'].includes(protocol)) { level = 'BERBAHAYA'; badgeClass = 'bg-red-900/60 text-red-300 border-red-800'; note = '🚫 Protokol berbahaya!'; }
                    else if (['ftp','file'].includes(protocol)) { level = 'HATI-HATI'; badgeClass = 'bg-orange-900/60 text-orange-300 border-orange-800'; }
                    else { level = 'TIDAK DIKENAL'; badgeClass = 'bg-gray-800 text-gray-300 border-gray-700'; }
                }

                securityBadge.textContent = level;
                securityBadge.className = `px-2.5 py-0.5 rounded-full text-xs font-bold border ${badgeClass}`;
                if (note) { securityNote.textContent = note; securityNote.classList.remove('hidden'); }
                if (url.hostname && /[^\x00-\x7F]/.test(url.hostname)) {
                    securityNote.textContent += ' 🌐 Domain non-ASCII.';
                    securityNote.classList.remove('hidden');
                    securityBadge.textContent = 'WASPADA';
                    securityBadge.className = 'px-2.5 py-0.5 rounded-full text-xs font-bold bg-red-900/60 text-red-300 border-red-800';
                }

                // Preview hanya untuk http/https dan bukan file berbahaya
                if (!isDangerousFile && (protocol === 'http' || protocol === 'https')) {
                    previewContainer.classList.remove('hidden');
                    applyFadeIn(previewContainer);
                    previewFrame.src = urlString;
                    previewFrame.classList.remove('hidden');
                    previewError.classList.add('hidden');
                    setTimeout(() => {
                        if (!previewFrame.contentDocument?.body?.innerHTML) {
                            previewFrame.classList.add('hidden');
                            previewError.classList.remove('hidden');
                        }
                    }, 2500);
                }
            }

            function onScanSuccess(decodedText) {
                if (html5QrCode && isScanning) {
                    html5QrCode.stop().then(() => { isScanning = false; updateUI(false); }).catch(() => {});
                }
                resultText.textContent = decodedText || '(kosong)';
                resultContainer.classList.remove('hidden');
                applyFadeIn(resultContainer);
                statusMsg.innerHTML = '✅ <span class="text-green-400">QR terdeteksi!</span>';
                parseAndCheckURL(decodedText);
            }

            function onScanFailure() {}

            async function startScanner() {
                try {
                    if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
                    await html5QrCode.start(
                        { facingMode: "environment" },
                        { fps: 10, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 },
                        onScanSuccess,
                        onScanFailure
                    );
                    isScanning = true;
                    updateUI(true);
                    statusMsg.innerHTML = '📷 <span class="text-indigo-300">Kamera aktif</span>';
                } catch (err) {
                    let msg = '❌ Gagal akses kamera. ';
                    if (err.name === 'NotAllowedError') msg += 'Izin ditolak.';
                    else if (err.name === 'NotFoundError') msg += 'Kamera tidak ada.';
                    else msg += 'Coba lagi.';
                    statusMsg.textContent = msg;
                    isScanning = false;
                    updateUI(false);
                }
            }

            async function stopScanner() {
                if (html5QrCode && isScanning) {
                    await html5QrCode.stop().catch(() => {});
                    isScanning = false;
                    updateUI(false);
                    statusMsg.textContent = '⏹️ Scanner berhenti.';
                }
            }

            function updateUI(scanning) {
                startBtn.disabled = scanning;
                stopBtn.disabled = !scanning;
                startBtn.classList.toggle('opacity-50', scanning);
                stopBtn.classList.toggle('opacity-30', !scanning);
            }

            copyBtn.addEventL
